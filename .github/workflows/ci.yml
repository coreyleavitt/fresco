name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: nim check + nimble test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        # The image is a Tumbleweed base + Nim. Cached across runs via
        # gha cache; first build on a fresh cache is ~3 min.
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: fresco-dev:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: nim check
        run: ./dev check

      - name: nimble test
        run: ./dev test

      - name: compile-check examples
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" \
            --volume "$PWD/.docker-home:/dockerhome" \
            --env HOME=/dockerhome \
            --workdir /workspace \
            fresco-dev:latest nimble examples
